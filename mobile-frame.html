<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartSoma</title>
  <style>
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; }
    body { display:grid; place-items:center; background:#e8ebe5; }
    .phone { width:min(444px,100%); height:min(920px,100dvh); padding:9px; border-radius:38px; background:#111c15; box-shadow:0 18px 55px #0b17103b; }
    iframe { display:block; width:100%; height:100%; border:0; border-radius:29px; background:#f6f3ea; }
    @media (max-width:760px) { .phone { width:100%; height:100dvh; padding:0; border-radius:0; } iframe { border-radius:0; } }
  </style>
</head>
<body>
  <main class="phone"><iframe id="app" title="SmartSoma"></iframe></main>
  <script src="mobile-frame-shell.js"></script>
</body>
</html>
